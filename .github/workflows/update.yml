name: Update jobs board

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run collector
        run: node collector/run.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain jobs.json)" ]; then
            git config user.name  "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add jobs.json
            git commit -m "chore: refresh jobs.json ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No change to jobs.json"
          fi
